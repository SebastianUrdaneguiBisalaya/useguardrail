name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # The package declares react >= 18, so keep proving it: swap in React 18 and re-run the adapter's checks.
  react-18:
    name: React 18 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use React 18
        run: pnpm --filter @useguardrail/react add -D -E react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18

      - name: Typecheck
        run: pnpm --filter @useguardrail/react run typecheck

      - name: Test
        run: pnpm --filter @useguardrail/react run test
