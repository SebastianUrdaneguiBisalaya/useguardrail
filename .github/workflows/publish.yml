name: Publish to npm

on:
  push:
    branches: [main]

# Never run two publishes at once, and never cancel one that is already running.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Publishes core first, because react and adapters depend on it.
      # A package is skipped when it is private or its current version is already on the registry,
      # so pushing to main without bumping a version publishes nothing.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in core react adapters; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            private=$(node -p "require('./packages/$dir/package.json').private === true")

            if [ "$private" = "true" ]; then
              echo "Skipping $name: package is private."
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version: already published."
              continue
            fi

            echo "Publishing $name@$version"
            (cd "packages/$dir" && pnpm publish --access public --no-git-checks --provenance)
          done
